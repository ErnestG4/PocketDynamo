; Cardputer ADV synth — standalone firmware (PlatformIO)
; Build:  pio run -e synth
; Flash:  pio run -e synth -t upload
; Artifact: .pio/build/<env>/firmware.bin
[platformio]
src_dir = src

[env]
; Pinned: the unpinned latest (espressif32 8.0.0 / Arduino 3.3 + M5Unified
; 0.2.28) boot-loops on the ADV with a spk_task stack-canary panic. This set is
; the one GLIDE ships on the ADV.
platform = espressif32@6.12.0
framework = arduino
board = m5stack-stamps3        ; Stamp-S3A (ESP32-S3FN8, 8MB) — Cardputer ADV core
monitor_speed = 115200
board_build.flash_size = 8MB
build_flags =
    -DCARDPUTER_ADV
lib_deps =
    m5stack/M5Cardputer@1.1.1                   ; keyboard; >=1.1.0 supports ADV
    m5stack/M5Unified@0.2.17
    https://github.com/m5stack/M5GFX.git#0.2.24   ; not in the registry at this version

; *_test.cpp are host-only (g++); excluded from firmware (each defines main()).

[env:synth]
; USB CDC on boot: Serial is the USB port (the 'B' perf bench, logs), not UART0
; on GPIO43/44.
build_src_filter = -<*> +<synth/> -<synth/*_test.cpp>
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:synth-usb-midi]
; Audio + USB MIDI. ESP32-S3 native USB-OTG via TinyUSB.
; USB_MODE=0 selects OTG/TinyUSB so the device can enumerate as a USB-MIDI
; class; mode 1 (HWCDC) is serial/JTAG only and cannot present a MIDI interface.
build_src_filter = -<*> +<synth/> -<synth/*_test.cpp>
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DSYNTH_USB_MIDI=1
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit TinyUSB Library @ ^3.1.0
    fortyseveneffects/MIDI Library @ ^5.0.2

[env:synth-ble-midi]
; Audio + BLE MIDI. Device name "Cardputer Synth".
build_src_filter = -<*> +<synth/> -<synth/*_test.cpp>
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSYNTH_BLE_MIDI=1
lib_deps =
    ${env.lib_deps}
    lathoub/BLE-MIDI @ ^2.2

[env:pd]
; PocketDynamo framework: own I2S + ES8311 full duplex, audio task on core 1.
; USB is TinyUSB on the OTG port: a composite of the serial console (CDC)
; and a USB-MIDI port, both named PocketDynamo. Flashing still works: an
; esptool reset over the CDC port (or serial 'U') reboots into ROM download
; mode on the USB-Serial/JTAG port. Crash backtraces don't reach USB in this
; mode: use env pd-jtag to debug one.
build_src_filter = -<*> +<pd/> -<pd/**/*_test.cpp>
board_build.variants_dir = variants
board_build.variant = pocketdynamo   ; stamp_s3 with its own USB PID (see its pins_arduino.h)
; Literals beside their code, so PD_HOT (IRAM) render paths defined inline
; in headers link: otherwise their constant pools land in flash, out of
; l32r's reach ("dangerous relocation: literal placed after use").
build_src_flags = -mtext-section-literals
build_unflags = -Os -std=gnu++11 -DARDUINO_USB_MODE=1
build_flags =
    ${env.build_flags}
    -O2
    -std=gnu++17
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    '-DUSB_PRODUCT="PocketDynamo"'
    '-DUSB_MANUFACTURER="Combust"'
    '-DPD_VERSION="0.3.0"'
    ; BLE MIDI: a peripheral with one connection, nothing else
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=1
    -DCONFIG_BT_NIMBLE_MAX_CCCDS=2
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino@2.3.9

[env:pd-jtag]
; The same firmware on the USB-Serial/JTAG port: no USB MIDI, but panics
; and backtraces print over USB.
extends = env:pd
build_unflags = -Os -std=gnu++11
build_flags =
    ${env.build_flags}
    -O2
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    '-DPD_VERSION="0.3.0-jtag"'
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=1
    -DCONFIG_BT_NIMBLE_MAX_CCCDS=2
